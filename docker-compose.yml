version: "3.9"

# =================================================================
# Banking Data Engineering Platform — Docker Compose
# =================================================================
# Services:
#   - postgres    : PostgreSQL 15 Data Warehouse
#   - airflow-init: One-time Airflow DB initialization
#   - airflow-web : Airflow Web UI (port 8080)
#   - airflow-sched: Airflow Scheduler
#   - spark-master: Spark Master (port 8081)
#   - spark-worker: Spark Worker
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v
# =================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Pipeline environment variables
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: banking_dw
    DATABASE_USER: banking_user
    DATABASE_PASSWORD: banking_password_dev
    STORAGE_MODE: local
    LOCAL_DATA_ROOT: /opt/airflow/data
    DATA_GENERATION_MODE: dev
    LOG_LEVEL: INFO
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./ingestion:/opt/airflow/ingestion
    - ./spark:/opt/airflow/spark
    - ./sql:/opt/airflow/sql
    - ./config:/opt/airflow/config
    - ./warehouse:/opt/airflow/warehouse
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - banking-net

services:

  # ---- PostgreSQL ----
  postgres:
    image: postgres:15-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - banking-net

  # ---- Airflow Init (runs once, then exits) ----
  airflow-init:
    <<: *airflow-common
    container_name: banking-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com \
          --password airflow
    restart: "no"

  # ---- Airflow Webserver ----
  airflow-web:
    <<: *airflow-common
    container_name: banking-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---- Airflow Scheduler ----
  airflow-scheduler:
    <<: *airflow-common
    container_name: banking-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---- Spark Master ----
  spark-master:
    image: bitnami/spark:3.5
    container_name: banking-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8080"    # Spark Master UI
      - "7077:7077"    # Spark Master port
    volumes:
      - ./data:/opt/bitnami/spark/data
      - ./spark:/opt/bitnami/spark/jobs
    networks:
      - banking-net

  # ---- Spark Worker ----
  spark-worker:
    image: bitnami/spark:3.5
    container_name: banking-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./data:/opt/bitnami/spark/data
      - ./spark:/opt/bitnami/spark/jobs
    depends_on:
      - spark-master
    networks:
      - banking-net

volumes:
  postgres-data:

networks:
  banking-net:
    driver: bridge
