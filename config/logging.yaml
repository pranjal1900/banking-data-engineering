# =================================================================
# Banking Data Engineering Platform — Logging Configuration
# =================================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    # Simple structured format — for production, use python-json-logger
    format: '{"time": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/pipeline.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf8

loggers:
  banking:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  banking.ingestion:
    level: INFO
    handlers: [console, file]
    propagate: false

  banking.spark:
    level: INFO
    handlers: [console, file]
    propagate: false

  banking.quality:
    level: INFO
    handlers: [console, file]
    propagate: false

  banking.fraud:
    level: INFO
    handlers: [console, file]
    propagate: false

  banking.warehouse:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
